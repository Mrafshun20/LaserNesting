name: Build Windows app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Windows distribution
        run: gradle :desktop:createDistributable :desktop:packageExe --stacktrace

      - name: Zip the runnable distribution
        shell: pwsh
        run: |
          $app = "desktop/build/compose/binaries/main/app/LaserNesting"
          if (-not (Test-Path $app)) { Write-Error "Distribution folder not found: $app"; exit 1 }
          Compress-Archive -Path "$app/*" -DestinationPath "LaserNesting-windows.zip" -Force

      - name: Upload Windows distribution (zip)
        uses: actions/upload-artifact@v4
        with:
          name: laser-nesting-windows
          path: LaserNesting-windows.zip

      - name: Upload Windows installer (exe)
        uses: actions/upload-artifact@v4
        with:
          name: laser-nesting-windows-installer
          path: desktop/build/compose/binaries/main/exe/*.exe
